services:
  - type: web
    name: denge-kasabasi-api
    runtime: node
    rootDir: demo/backend
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
